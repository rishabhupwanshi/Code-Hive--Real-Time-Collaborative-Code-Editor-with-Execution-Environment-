name: code-editor

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: code_editor
      POSTGRES_USER: codeeditor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeeditor_local_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeeditor -d code_editor"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: "276382700383-19c2vck52cj0vsdmfhcveri8dmngule4.apps.googleusercontent.com"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8086:8086"
      - "9092:9092"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/code_editor
      SPRING_DATASOURCE_USERNAME: codeeditor
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-codeeditor_local_password}
      GOOGLE_CLIENT_ID: "276382700383-19c2vck52cj0vsdmfhcveri8dmngule4.apps.googleusercontent.com"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      EXECUTION_DOCKER_ENABLED: "false"

volumes:
  postgres-data: